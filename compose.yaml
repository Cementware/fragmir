services:
  mariadb:
    image: mariadb
    restart: always
    ports:
      - 3306:3306
    environment:
        MARIADB_ROOT_PASSWORD: password
        MARIADB_DATABASE: fragmir
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build: ./backend
    ports:
      - 3000:3000
    environment:
      DB_HOST: mariadb
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: fragmir
    depends_on:
      - mariadb
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build: ./frontend
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  mariadb_data:
